<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyle | 个人主页</title>
    <meta name="description" content="Kyle 的个人主页，分享编程、游戏开发与个人项目。" />
    <meta name="theme-color" content="#49b1f5" />
    <link rel="icon" href="./favicon.ico" />

    <!-- 搜索引擎和社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kyle | 个人主页" />
    <meta property="og:description" content="分享编程、游戏开发与个人项目。" />
    <meta property="og:url" content="https://kylemarvin884.github.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kyle | 个人主页" />
    <meta name="twitter:description" content="分享编程、游戏开发与个人项目。" />

    <!-- 样式表 -->
    <link rel="stylesheet" href="./assets/styles/loaders.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/styles/elements.css" />
    <link rel="stylesheet" href="./assets/styles/index.css" />
    <link rel="stylesheet" href="./assets/styles/responsive/index.css" />
    <link rel="manifest" href="/manifest.json">


    <!-- 依赖先加载，Alpine 最后启动以保证配置可用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.3.2/markdown-it.min.js" defer></script>
    <script src="./assets/scripts/utils.js" defer></script>
    <script src="./assets/scripts/theme-loader.js" defer></script>
    <script src="./assets/scripts/index.js" defer></script>
    <script src="./assets/scripts/site-interactions.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.9.0/cdn.min.js" defer></script>

    <theme></theme>
</head>
<body x-data="{}">
    <header class="page-head">
        <span class="title">Kyle · Home</span>
    </header>

    <main class="primary-container">
        <aside class="left-area">
            <div class="search-bar">
                <input type="search" id="search-input" placeholder="搜索卡片..." aria-label="搜索网站卡片" />
            </div>
            <section class="cards">
                <article class="card-item" id="personal-info">
                    <img class="avatar" src="./assets/images/avatar.png" alt="Kyle 的头像" width="120" height="120" loading="lazy" />
                    <h2 class="name" x-text="config.content.masterInfo.name">Kyle</h2>
                    <div class="social-icons" aria-label="社交媒体链接"></div>
                </article>
                <article class="card-item" id="recommend">
                    <h2><i class="fa-solid fa-bullhorn"></i>公告</h2>
                    <div class="content">
                        <span id="typed-announcement"></span>
                    </div>
                </article>
                <article class="card-item" id="hitokoto">
                    <h2><i class="fa-solid fa-scroll"></i>一言</h2>
                    <div class="content">
                        <a id="hitokoto-text" href="" target="_blank">Loading...</a>
                    </div>
                </article>
                <article class="card-item" id="settings">
                    <h2><i class="fa-solid fa-sliders"></i>浏览设置</h2>
                    <div class="content">
                        <div class="settings-item theme-settings">
                            <p><i class="fa-solid fa-shirt"></i>配色方案 · <span x-text="config.content.theme.displayName"></span></p>
                            <div class="themes"></div>
                        </div>
                    </div>
                </article>
            </section>
        </aside>
        <section class="right-area">
            <div class="content-page">
                <div class="markdown-content" src="./assets/markdown/content-page.md"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span class="icp-info"></span>
        <span class="line-break"><i class="fa-solid fa-ellipsis"></i></span>
        <span>
            本站由 <span class="webmaster-info"><a :href="config.content.masterInfo.website" href="https://kylemarvin884.github.io/" target="_blank" rel="noopener noreferrer" x-text="config.content.masterInfo.name">Kyle</a></span>
            <i class="fa-solid fa-heart"></i> 制作
        </span>
        <span>基于 <a href="https://github.com/ChengCheng0v0/ACG-Home" target="_blank" rel="noopener noreferrer">ACG Home</a> 模板</span>
        <button id="copy-link" type="button">复制链接</button>
    </footer>

    <iframe id="global-loader-iframe" src="./loaders/global.html"></iframe>
    <iframe id="theme-color-loader-iframe" src="./loaders/theme-color.html"></iframe>

    <button id="back-to-top" type="button" style="display:none;">返回顶部</button>


</body>
</html>
